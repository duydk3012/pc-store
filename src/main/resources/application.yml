spring:
  application:
    name: pc-store
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Cấu hình dự án
app:
  verification:
    mail-from: ${MAIL_FROM:}
  admin:
    password: ${ADMIN_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 900000            # access token: 15 phút
    refresh-expiration-ms: 604800000 # refresh token: 7 ngày
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173} # Vite dev server
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8000} # FastAPI
  cleanup:
    enabled: true
    refresh-token-cron: "0 0 3 * * *"   # giây phút giờ ngày tháng thứ
